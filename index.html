<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Define a codificação de caracteres -->
    <meta charset="UTF-8">

    <!-- Faz o site se adaptar a dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Importa o arquivo CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Título da aba do navegador -->
    <title>Convite</title>
</head>
<body>

    <!-- Container principal do envelope -->
    <div class="envelope-wrapper">

        <!-- Envelope fechado inicialmente -->
        <div id="envelope" class="close">

            <!-- Aba superior do envelope -->
            <div class="front flap"></div>

            <!-- Parte frontal do envelope -->
            <div class="front pocket"></div>

            <!-- Carta dentro do envelope -->
            <div class="letter">

                <!-- Linhas decorativas simulando texto 
                <div class="words line1"></div>
                <div class="words line2"></div>
                <div class="words line3"></div>
                <div class="words line4"></div> -->
                <img src="convite.png" alt="">

            </div>

            <!-- Grupo de corações animados -->
            <div class="hearts">

                <!-- Coração 1 -->
                <div class="heart a1"></div>

                <!-- Coração 2 -->
                <div class="heart a2"></div>

                <!-- Coração 3 -->
                <div class="heart a3"></div>

            </div>
        </div>
    </div>

    <!-- Área dos botões 
    <div class="reset">

        <button id="open">Open</button>

        <button id="reset">Reset</button>

    </div> -->

    <!-- Importa a biblioteca jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Importa o JavaScript personalizado -->
    <script src="script.js"></script>

</body>
</html>
